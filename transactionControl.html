<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/transactionControl.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="description" content="quản lý giao dịch">
    <title>Danh sách giao dịch</title>
</head>

<body>
    <div class="container-fluid p-4" style="max-width: 1400px; margin: 0 auto;">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <h1 class="header-title mb-1">Giao dịch</h1>
                <p class="text-muted-custom mb-0">Quản lý tất cả thu chi của bạn</p>
            </div>
            
            <div class="d-flex align-items-center">
                <button class="btn date-picker-btn me-4 d-flex align-items-center rounded-3 px-3 py-2">
                    <i class="bi bi-calendar3 me-2 text-secondary"></i>
                    <span class="me-2" style="font-size: 14px;">01/08/2025 - 31/08/2025</span>
                    <i class="bi bi-chevron-down ms-1 text-secondary" style="font-size: 12px;"></i>
                </button>
                
                <!-- <div class="notification-bell d-flex align-items-center">
                    <i class="bi bi-bell"></i>
                    <span class="notification-badge">3</span>
                </div> -->
                
                <div class="dropdown d-flex align-items-center ms-2" style="cursor: pointer;" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="avatar-circle me-2">M</div>
                    <div class="user-info d-none d-md-block pe-1">
                        <p class="user-name">Minh</p>
                        <p class="user-role">Sinh viên năm 2</p>
                    </div>
                    <i class="bi bi-chevron-down text-secondary ms-1 d-none d-md-block" style="font-size: 12px;"></i>
                </div>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                    <li><a class="dropdown-item" href="#">Thông tin cá nhân</a></li>
                    <li><a class="dropdown-item text-danger" href="#">Đăng xuất</a></li>
                </ul>
            </div>
        </div>


        <div class="filter-card d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <div class="position-relative flex-grow-1" style="max-width: 380px;">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="form-control search-input py-2" placeholder="Tìm theo mô tả, danh mục, địa điểm...">
            </div>
            
            <div class="d-flex gap-2 flex-wrap flex-grow-1 justify-content-lg-end">
                <select class="form-select filter-select py-2" style="width: auto; min-width: 150px;">
                    <option selected>Tất cả danh mục</option>
                </select>
                <select class="form-select filter-select py-2" style="width: auto; min-width: 130px;">
                    <option selected>Tất cả loại</option>
                </select>
                <select class="form-select filter-select py-2" style="width: auto; min-width: 160px;">
                    <option selected>Tất cả tài khoản</option>
                </select>
                
                <div class="d-flex gap-2 ms-lg-2">
                    <button class="btn btn-filter px-3 py-2 d-flex align-items-center">
                        <i class="bi bi-funnel me-2"></i> Bộ lọc
                    </button>
                    <button class="btn btn-export px-3 py-2 d-flex align-items-center">
                        <i class="bi bi-download me-2"></i> Xuất Excel
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/transactionControl.js"></script>
</body>

</html>
