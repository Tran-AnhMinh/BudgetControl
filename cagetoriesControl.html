<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/cagetoriesControl.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="description" content="quản lý danh mục">
    <title>Danh sách danh mục</title>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <div class="d-flex">

        <nav class="sidebar collapsed d-flex flex-column flex-shrink-0 position-fixed">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="bi bi-caret-left-fill"></i>
            </button>

            <div class="p-4">
                <h4 class="logo-text fw-bold mb-0">Finora</h4>
            </div>

            <div class="nav flex-column">
                <a href="mainPage.html" class="sidebar-link text-decoration-none p-3">
                    <i class="bi bi-house me-3"></i>
                    <span class="hide-on-collapse">Dashboard</span>
                </a>
                <a href="transactionControl.html" class="sidebar-link text-decoration-none p-3">
                    <i class="bi bi-wallet me-3"></i>
                    <span class="hide-on-collapse">Chi tiêu</span>
                </a>
                <a href="cagetoriesControl.html" class="sidebar-link active text-decoration-none p-3">
                    <i class="bi bi-tags me-3"></i>
                    <span class="hide-on-collapse">Danh mục</span>
                </a>

                <a href="#" class="sidebar-link text-decoration-none p-3">
                    <i class="bi-qr-code me-3"></i>
                    <span class="hide-on-collapse">QR</span>
                </a>
            </div>
        </nav>
        <div class="main-content flex-grow-1">
        <div class="container-fluid p-4 flex" style="margin: 0 auto;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h1 class="header-title mb-1">Danh mục</h1>
                    <p class="text-muted-custom mb-0">Quản lý tất cả danh mục của bạn</p>
                </div>

                <div class="d-flex align-items-center">
                    <!-- <button class="btn date-picker-btn me-4 d-flex align-items-center rounded-3 px-3 py-2">
                <i class="bi bi-calendar3 me-2 text-secondary"></i>
                <span class="me-2" style="font-size: 14px;">01/08/2025 - 31/08/2025</span>
                <i class="bi bi-chevron-down ms-1 text-secondary" style="font-size: 12px;"></i>
            </button> -->

                    <!-- <div class="notification-bell d-flex align-items-center">
                <i class="bi bi-bell"></i>
                <span class="notification-badge">3</span>
            </div> -->

                    <div class="dropdown d-flex align-items-center ms-2" style="cursor: pointer;"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar-circle me-2">M</div>
                        <div class="user-info d-none d-md-block pe-1">
                            <p class="user-name">Minh</p>
                            <p class="user-role">Sinh viên năm 2</p>
                        </div>  
                        <i class="bi bi-chevron-down text-secondary ms-1 d-none d-md-block"
                            style="font-size: 12px;"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                        <li><a class="dropdown-item" href="#">Thông tin cá nhân</a></li>
                        <li><a class="dropdown-item text-danger" href="#">Đăng xuất</a></li>
                    </ul>
                </div>
            </div>

        </div>

        <div class="container-fluid p-0 m-0 d-flex justify-content-start">
            <div class="container p-0 m-0 ms-0 me-auto">
                <div class="filter-card d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                    <div class="d-flex gap-2 flex-wrap flex-grow-1 justify-content-lg-end">
                        <div class="fw-bold mb-2 mb-md-0" style="font-size: 15px;" id="total-transaction">Tổng <span
                            id="category-count">42</span> danh mục
                        </div>

                        <div class="d-flex gap-2 ms-lg-2">
                            <button type="button" class="btn btn-export px-3 py-2 d-flex align-items-center"
                                id="btn-export-excel-cagetories">
                                <i class="bi bi-download me-2"></i> Xuất Excel
                            </button>
                            <button type="button" class="btn btn-add px-3 py-2 d-flex align-items-center"
                                data-bs-toggle="modal" data-bs-target="#addCategoryModal"
                                id="add-category-btn">
                                <i class="bi bi-plus-lg me-2"></i> Thêm danh mục
                            </button>

                        </div>
                    </div>
                </div>

                
                <div class="table-responsive bg-white rounded-3 border mb-3">
                    <table class="table table-hover align-middle mb-0" style="font-size: 14px;">
                        <thead class="table-light text-secondary">
                            <tr>
                                <th scope="col" class="fw-medium text-nowrap text-center">Số</th>
                                <th scope="col" class="fw-medium text-nowrap text-center">Tên <button type="button"
                                        class="btn btn-link p-0 ms-1 align-baseline" id="btn-sort-type" style="line-height: 1;"><i class="bi bi-chevron-expand"
                                            style="font-size: 12px; cursor: pointer;"></i></button></th>
                                <th scope="col" class="fw-medium text-nowrap text-center">Tài khoản <button
                                        type="button" class="btn btn-link p-0 ms-1 align-baseline" id="btn-sort-account" style="line-height: 1;"><i
                                            class="bi bi-chevron-expand"
                                            style="font-size: 12px; cursor: pointer;"></i></button></th>
                                <th scope="col" class="fw-medium text-end text-nowrap text-center">Số tiền <button
                                        type="button" class="btn btn-link p-0 ms-1 align-baseline" id="btn-sort-amount" style="line-height: 1;"><i
                                            class="bi bi-chevron-expand"
                                            style="font-size: 12px; cursor: pointer;"></i></button></th>
                                <th scope="col" class="fw-medium text-end text-nowrap text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="border-top-0" id="transaction-table-body">
                        </tbody>
                    </table>
                </div>


                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-3 mb-4">
                    <div class="mb-3 mb-md-0 d-none d-md-block" style="width: 120px;"></div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="pagination-container">
                        </ul>
                    </nav>
                    <div class="d-flex align-items-center text-secondary mt-3 mt-md-0" style="font-size: 13px;">
                        <span class="me-2">Hiển thị</span>
                        <select class="form-select form-select-sm" style="width: auto; font-size: 13px;"
                            id="items-per-page-select">
                            <option value="10" selected>10 / trang</option>
                            <option value="20">20 / trang</option>
                            <option value="50">50 / trang</option>
                        </select>
                    </div>
                </div>
            </div>
